<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Toko Adi - Portfolio</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #222;
      --card: #f9f9f9;
      --primary: #4CAF50;
    }

    body.dark-mode {
      --bg: #1a1a1a;
      --text: #f1f1f1;
      --card: #333;
    }

    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      transition: all 0.3s ease;
    }

    header {
      padding: 20px;
      text-align: center;
      background-color: var(--primary);
      color: white;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    h1, h2 {
      margin-bottom: 10px;
    }

    p {
      color: #555;
    }

    .dark-mode p {
      color: #ccc;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }

    .product-card {
      background-color: var(--card);
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      transition: transform 0.2s ease;
    }

    .product-card:hover {
      transform: translateY(-5px);
    }

    .product-card img {
      max-width: 100%;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .price {
      color: var(--primary);
      font-weight: bold;
      margin: 10px 0;
    }

    button {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #3e9143;
    }

    footer {
      text-align: center;
      padding: 30px 20px;
      font-size: 14px;
      background: var(--card);
      margin-top: 40px;
    }

    .toggle-mode {
      position: fixed;
      top: 10px;
      right: 10px;
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 20px;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <button class="toggle-mode" onclick="toggleMode()">🌙/☀️</button>

  <header>
    <h1>Toko Adi</h1>
    <p>Portfolio sederhana yang menampilkan 6 produk unggulan kami</p>
  </header>

  <div class="container">
    <h2>Produk Unggulan</h2>
    <div class="products">
      <!-- Produk 1 -->
      <div class="product-card">
        <img src="https://via.placeholder.com/250x180?text=Produk+1" alt="Produk 1">
        <h3>Produk 1</h3>
        <p class="price">Rp 100.000</p>
        <button>Beli</button>
      </div>
      <!-- Produk 2 -->
      <div class="product-card">
        <img src="https://via.placeholder.com/250x180?text=Produk+2" alt="Produk 2">
        <h3>Produk 2</h3>
        <p class="price">Rp 120.000</p>
        <button>Beli</button>
      </div>
      <!-- Produk 3 -->
      <div class="product-card">
        <img src="https://via.placeholder.com/250x180?text=Produk+3" alt="Produk 3">
        <h3>Produk 3</h3>
        <p class="price">Rp 90.000</p>
        <button>Beli</button>
      </div>
      <!-- Produk 4 -->
      <div class="product-card">
        <img src="https://via.placeholder.com/250x180?text=Produk+4" alt="Produk 4">
        <h3>Produk 4</h3>
        <p class="price">Rp 150.000</p>
        <button>Beli</button>
      </div>
      <!-- Produk 5 -->
      <div class="product-card">
        <img src="https://via.placeholder.com/250x180?text=Produk+5" alt="Produk 5">
        <h3>Produk 5</h3>
        <p class="price">Rp 110.000</p>
        <button>Beli</button>
      </div>
      <!-- Produk 6 -->
      <div class="product-card">
        <img src="https://via.placeholder.com/250x180?text=Produk+6" alt="Produk 6">
        <h3>Produk 6</h3>
        <p class="price">Rp 80.000</p>
        <button>Beli</button>
      </div>
    </div>
  </div>

  <footer>
    <p>Hubungi kami di <strong>tokoadi@email.com</strong> | &copy; 2025 Toko Adi</p>
  </footer>

  <script>
    function toggleMode() {
      document.body.classList.toggle('dark-mode');
    }
  </script>
</body>
</html>
